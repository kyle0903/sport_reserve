<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>運動中心快速預約</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Condensed:ital,wght@1,600;1,700;1,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="shell">
      <form class="app" id="reservationForm">
        <header class="topbar">
          <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M9 4h14l-3.5 15h-7z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M14 4l.6 15M18 4l-.6 15M10 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".6" />
            <circle cx="16" cy="24.5" r="4.5" fill="currentColor" />
          </svg>
          <span class="zzz" aria-hidden="true"><i>z</i><i>z</i><i>Z</i></span>
          <h1>運動中心快速預約</h1>
          <button type="button" class="avatar" id="avatar" title="確認登入中…">
            <span id="avatarText"></span>
          </button>
        </header>

        <section class="hero-card" id="heroCard">
          <p class="hero-meta" id="heroMeta"></p>
          <div class="hero-main">
            <div class="hero-time">
              <b id="heroTime">--:--</b>
              <small id="heroEnd"></small>
            </div>
            <div class="hero-count">
              <b id="heroCount">–</b>
              <small id="heroCountLabel"></small>
            </div>
          </div>
        </section>

        <div class="body">
          <div class="segmented">
            <label><input type="radio" name="sport" value="badminton" checked /><span>羽球</span></label>
            <label><input type="radio" name="sport" value="pickleball" /><span>匹克球</span></label>
          </div>

          <div class="segmented">
            <label><input type="radio" name="place" value="SC" checked /><span>三重</span></label>
            <label><input type="radio" name="place" value="LZ" /><span>蘆洲</span></label>
            <label><input type="radio" name="place" value="BQ" /><span>板橋</span></label>
          </div>

          <div class="days" id="dateChips"></div>
          <div class="schedule-target" id="scheduleTarget" hidden></div>

          <section class="slots">
            <div class="slots-head">
              <span class="slots-title">時段</span>
              <div class="segmented segmented-sm">
                <label><input type="radio" name="hours" value="1" /><span>1 小時</span></label>
                <label><input type="radio" name="hours" value="2" checked /><span>2 小時</span></label>
              </div>
            </div>
            <div id="timeChips"></div>
            <p class="avail-note" id="availNote"></p>
          </section>

          <p class="error" id="errorBox" role="alert" hidden></p>
        </div>

        <footer class="action-bar">
          <input type="checkbox" name="schedule" value="1" id="scheduleToggle" hidden />
          <button type="button" class="btn-outline" id="scheduleButton">00:00 自動搶</button>
          <button type="submit" class="btn-primary" id="submitButton">
            <span class="btn-label" id="submitLabel">立即預約 →</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </footer>

        <div class="waiting" id="waiting" hidden>
          <ol class="steps">
            <li class="step-item done" id="stepScheduled">
              <b>已排程</b>
              <small id="waitSummary"></small>
            </li>
            <li class="step-item active" id="stepWaiting">
              <b>等待開放中</b>
              <div class="countdown">
                <span id="countdownText">--:--:--</span>
                <span class="clock-chip" id="clockChip" hidden></span>
              </div>
              <small id="checkText">確認登入中…</small>
            </li>
            <li class="step-item" id="stepSending">
              <b>00:00 送出預約</b>
              <small>開放瞬間自動送出</small>
            </li>
            <li class="step-item" id="stepDone">
              <b>完成</b>
            </li>
          </ol>
          <p class="waiting-hint">請保持面板開著、電腦不要睡眠</p>
          <button type="button" class="btn-outline" id="cancelButton">取消排程</button>
        </div>
      </form>

      <section class="app result" id="formResult" hidden>
        <div class="result-head">
          <div class="check" aria-hidden="true">✓</div>
          <h2>預約成功！</h2>
          <p>請在期限內完成付款，場地才會保留</p>
        </div>
        <ul class="tickets" id="resultContent"></ul>
        <div class="result-actions">
          <a class="btn-primary" id="payLink" target="_blank" rel="noopener"><span class="btn-label">前往訂單付款 →</span></a>
          <button type="button" class="btn-outline" id="againButton">再預約一次</button>
        </div>
      </section>
    </main>
  </body>
</html>
